<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}IT Help Center{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="{{ url_for('index') }}">🛠️ IT Help Center</a>
      <nav>
        <a href="{{ url_for('index') }}">Knowledge Base</a>
        <a href="{{ url_for('request_form') }}">Request Help</a>
        <a href="{{ url_for('status') }}">Check Ticket Status</a>
        <a href="{{ url_for('admin_tickets') }}">IT Queue (demo)</a>
      </nav>
    </div>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    Demo project by Bernie G. — not connected to a real ticketing system or Active Directory.
  </footer>
</body>
</html>
